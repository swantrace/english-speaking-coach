services:
  # LiveKit Server for local development
  livekit:
    image: livekit/livekit-server:latest
    container_name: coach-livekit
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880" # WebRTC signaling
      - "7881:7881" # HTTP API
      - "50000-50020:50000-50020/udp" # RTP/UDP ports (reduced for local dev)
    networks:
      - agent_network

  # MinIO for S3-compatible object storage (local development)
  minio:
    image: minio/minio:latest
    container_name: coach-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agent_network

  # Redis for BullMQ worker job queue
  redis:
    image: redis:7-alpine
    container_name: coach-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agent_network

  # Optional LiveKit agent service for local self-hosted development.
  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile.dev
    container_name: coach-agent
    working_dir: /workspace
    command: >-
      sh -c "pnpm install --frozen-lockfile && cd apps/agent && pnpm download-files && pnpm dev"
    env_file:
      - path: ./apps/agent/.env.local
        required: true
      - path: ./apps/agent/.env.docker
        required: true
    volumes:
      - .:/workspace
      - agent_node_modules:/workspace/node_modules
      - agent_app_node_modules:/workspace/apps/agent/node_modules
      - agent_pnpm_store:/pnpm/store
      - agent_cache:/root/.cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      livekit:
        condition: service_started
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    networks:
      - agent_network

volumes:
  minio_data:
  redis_data:
  agent_node_modules:
  agent_app_node_modules:
  agent_pnpm_store:
  agent_cache:

networks:
  agent_network:
    driver: bridge
